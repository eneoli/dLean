name = "dLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[require]]
name = "Qq"
scope = "leanprover-community"

[[lean_lib]]
name = "DLean"
